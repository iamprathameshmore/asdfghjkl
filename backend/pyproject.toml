
[tool.poetry]
name = "wind-forecast-portal"
version = "0.1.0"
description = "UK wind generation forecast analysis dashboard"
authors = ["Developer"]
package-mode = false

[tool.poetry.dependencies]
python = ">=3.12,<3.14"
fastapi = "^0.115"
uvicorn = { version = "^0.34", extras = ["standard"] }
httpx = "^0.28"
pandas = "^2.2"
pydantic-settings = "^2.7"
pymongo = "^4.19.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3"
pytest-asyncio = "^0.25"
ruff = "^0.9"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.poetry.scripts]
start = "run:main"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
